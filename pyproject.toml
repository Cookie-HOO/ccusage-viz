[project]
name = "ccusage-viz"
version = "0.1.0"
description = "Stateless terminal visualizations for ccusage token data"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Cookie HOO" }]
requires-python = ">=3.11,<3.14"
dependencies = ["plotext>=6.1,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]

[project.scripts]
ccusage-viz = "ccusage_viz.cli:main"
ccuv = "ccusage_viz.cli:main"

[project.urls]
Homepage = "https://github.com/Cookie-HOO/ccusage-viz"
Issues = "https://github.com/Cookie-HOO/ccusage-viz/issues"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["LICENSE", "README.zh-CN.md", "docs/**", "examples/**"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
  "ty>=0.0.1a20,<0.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
